name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Ruff
        run: uv run --no-default-groups --group dev ruff check .

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # All extras: the local extra resolves the locked torch build, which is
      # large but lets the GPU-free engine/task tests run instead of skipping.
      # Drop `--all-extras` if runner disk or time becomes a problem — every
      # torch-dependent test importorskips.
      - name: Install
        run: uv sync --all-extras
      - name: Test
        run: uv run pytest
