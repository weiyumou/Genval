[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "genval"
version = "0.1.0"
description = "Generate-Then-Validate: LLM question generation and validation from learning objectives"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Yumou Wei", email = "yumouw@andrew.cmu.edu" }]
keywords = [
    "question generation",
    "learning objectives",
    "multiple-choice questions",
    "large language models",
    "learning analytics",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
# kcluster is the backbone (Question, JSONL I/O, PMI, the local Phi-2 engine,
# question rendering); it is not on PyPI, so it resolves through
# [tool.uv.sources] below (pinned git commit).
dependencies = [
    "kcluster",
    "numpy>=1.26",
    "pandas>=2.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
# Phi-2 stages (generate / validate / classify) on a local GPU
local = ["kcluster[local]"]
# Gemini as generator or judge (Developer API or Vertex AI); the engine
# itself is KCluster's
gemini = ["kcluster[gemini]"]
# Claude as generator or judge (Vertex AI, Bedrock, or the direct API)
claude = ["anthropic[bedrock,vertex]>=0.122.0"]
# both LLM engines
llm = ["genval[gemini,claude]"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    {include-group = "papers"},
]
# Analysis-notebook dependencies for papers/; never shipped in the wheel
papers = ["seaborn>=0.13", "statsmodels>=0.14", "matplotlib>=3.8"]

[project.scripts]
genval = "genval.cli:main"

[project.urls]
Repository = "https://github.com/weiyumou/Genval"
"KCluster (backbone)" = "https://github.com/weiyumou/KCluster"

[tool.uv.sources]
kcluster = { git = "https://github.com/weiyumou/KCluster", rev = "414fd422417f45f2385c2119e71c3d92e438e5ea" }

[tool.setuptools.packages.find]
include = ["genval*"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
